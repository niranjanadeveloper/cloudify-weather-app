<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" fill="none">
  <defs>
    <!-- Sky blue gradient for background badge -->
    <linearGradient id="cloudifyBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>

    <!-- Warm vibrant gradient for Sun -->
    <linearGradient id="sunGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>

    <!-- Soft clean cloud gradient -->
    <linearGradient id="cloudGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#e0f2fe" />
    </linearGradient>

    <!-- Soft drop shadow for cloud depth -->
    <filter id="softShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#0f172a" flood-opacity="0.15" />
    </filter>
  </defs>

  <!-- Rounded App Icon Background -->
  <rect width="64" height="64" rx="16" fill="url(#cloudifyBg)" />

  <!-- Sun with warm glow accent -->
  <circle cx="41" cy="23" r="10" fill="url(#sunGrad)" />
  <!-- Sun Rays -->
  <g stroke="#f59e0b" stroke-width="2" stroke-linecap="round" opacity="0.85">
    <line x1="41" y1="9" x2="41" y2="11" />
    <line x1="53" y1="17" x2="51.5" y2="18.5" />
    <line x1="55" y1="23" x2="53" y2="23" />
    <line x1="51.5" y1="29" x2="53" y2="30.5" />
  </g>

  <!-- Modern Fluffy Cloud Shape -->
  <path
    d="M21 47h25a9 9 0 0 0 2.2-17.7 12 12 0 0 0-21.7-5.5A8.5 8.5 0 0 0 21 47z"
    fill="url(#cloudGrad)"
    filter="url(#softShadow)"
  />
</svg>